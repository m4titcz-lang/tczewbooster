<style>
  :root {

    --soft: #a8b0c0;
    --muted: #747c8e;

  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {

  .langs button:hover { color: var(--text); }
  .langs button.on { background: var(--silver); color: #101014; }
  .button {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; border-radius: 14px; cursor: pointer;
    background: var(--silver); color: #101014;
    padding: 10px 18px; font-size: 14px;

  .hero .wrap { display: grid; grid-template-columns: 1fr 1.12fr; gap: 48px; align-items: center; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;

    padding: 6px 12px; border-radius: 999px;

  .meta { font-size: 13px; color: var(--muted); }
  .meta strong { color: var(--soft); font-weight: 600; }

  .hero .stage:hover .window { transform: none; }

  .shots figcaption { margin-top: 12px; font-size: 14px; color: var(--soft); text-align: center; }

  /* ---- enlarged screenshot */
  .lightbox {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; cursor: zoom-out;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox figure { margin: 0; max-width: min(1500px, 92vw); transform: scale(0.96); transition: transform 0.2s; cursor: default; }
  .lightbox.open figure { transform: none; }
  .lightbox img { max-height: 82vh; width: auto; margin: 0 auto; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8); }
  .lightbox figcaption { margin-top: 14px; text-align: center; color: var(--soft); font-size: 15px; }
  .lightbox button {
    position: absolute; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;

  .lightbox button:hover { background: rgba(255, 255, 255, 0.2); }
  .lightbox .close { top: 20px; right: 20px; }
  .lightbox .prev { left: 20px; top: calc(50% - 24px); }
  .lightbox .next { right: 20px; top: calc(50% - 24px); }

  /* ---- steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 44px; counter-reset: step; }
  .step { padding: 26px; border-radius: 20px; border: 1px dashed rgba(255, 255, 255, 0.16); }
  .step::before {
    counter-increment: step; content: counter(step);
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%; font-weight: 900;

  .note { margin-top: 18px; font-size: 13px; color: var(--muted); max-width: 520px; margin-left: auto; margin-right: auto; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14px; }

  footer a:hover { color: var(--text); }
  footer .right { margin-left: auto; }

    .grid, .shots, .steps { grid-template-columns: 1fr; }
    section { padding: 56px 0; }
    header .button { display: none; }
    footer .right { margin-left: 0; }

function setLanguage(language) {
  const texts = TEXTS[language];
  document.documentElement.lang = language;
  document.title = texts.title;
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = texts[node.dataset.t];
  document.getElementById('features-grid').innerHTML = FEATURES.map(([icon, key]) => `
    <div class="card">
      <div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[icon]}</svg></div>
      <h3>${texts[key]}</h3>
      <p>${texts[key + 'd']}</p>
    </div>`).join('');
  for (const button of document.querySelectorAll('#langs button')) button.classList.toggle('on', button.dataset.lang === language);
  try { localStorage.setItem('language', language); } catch { /* private window */ }
}

for (const link of document.querySelectorAll('.download')) link.href = DOWNLOAD;
for (const button of document.querySelectorAll('#langs button')) button.addEventListener('click', () => setLanguage(button.dataset.lang));

// The player is loaded only when asked for, so the page itself stays light
document.querySelector('#video-box button').addEventListener('click', () => {
  document.getElementById('video-box').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${VIDEO}?autoplay=1&rel=0" title="TczewBooster preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
});

// Screenshots open enlarged; arrows (on screen or on the keyboard) step through them
const lightbox = document.getElementById('lightbox');
const shots = [...document.querySelectorAll('.shots figure')];
let shown = 0;
function showShot(index) {
  shown = (index + shots.length) % shots.length;
  lightbox.querySelector('img').src = shots[shown].querySelector('img').src;
  lightbox.querySelector('figcaption').textContent = shots[shown].querySelector('figcaption').textContent;
  lightbox.classList.add('open');
}
shots.forEach((shot, index) => shot.querySelector('.window').addEventListener('click', () => showShot(index)));
lightbox.addEventListener('click', event => {
  if (event.target.closest('.prev')) showShot(shown - 1);
  else if (event.target.closest('.next')) showShot(shown + 1);
  else if (!event.target.closest('figure')) lightbox.classList.remove('open');
});
document.addEventListener('keydown', event => {
  if (!lightbox.classList.contains('open')) return;
  if (event.key === 'Escape') lightbox.classList.remove('open');
  if (event.key === 'ArrowLeft') showShot(shown - 1);
  if (event.key === 'ArrowRight') showShot(shown + 1);
});

let saved = null;
try { saved = localStorage.getItem('language'); } catch { /* private window */ }
const browser = (navigator.language || 'en').slice(0, 2);
setLanguage(TEXTS[saved] ? saved : TEXTS[browser] ? browser : 'en');
</script>
